<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="360" viewBox="0 0 1120 360">
  <title>TileLang–Weft Bench: source JIT and matched native measurement</title>
  <desc>TileLang author programs compile on the execution target through the shared Canonical compiler. Bench measures the successful artifact against a matching native reference and keeps JIT timings separate.</desc>
  <defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9" fill="#526579"/></marker></defs>
  <rect width="1120" height="360" rx="20" fill="#f6f9fc"/>
  <g font-family="DejaVu Sans,Arial,sans-serif" fill="#203347">
    <text x="36" y="44" font-size="24" font-weight="bold">One workload · TileLang source · Actual CPU execution</text>
    <g stroke="#c6d4e1" stroke-width="1.5">
      <rect x="36" y="82" width="220" height="104" rx="12" fill="#e0eef8"/>
      <rect x="306" y="82" width="220" height="104" rx="12" fill="#e6f2e9"/>
      <rect x="576" y="82" width="220" height="104" rx="12" fill="#e6f2e9"/>
      <rect x="846" y="82" width="238" height="104" rx="12" fill="#f9edda"/>
    </g>
    <g font-size="18" font-weight="bold">
      <text x="54" y="113">Author program</text><text x="324" y="113">Target-native JIT</text>
      <text x="594" y="113">Shared Weft core</text><text x="864" y="113">Native workload</text>
    </g>
    <g font-size="14">
      <text x="54" y="140">TileLang + Encoding / Level</text><text x="54" y="165">shape · variant · engine</text>
      <text x="324" y="140">installed TileLang factory</text><text x="324" y="165">specialize · compile · cache</text>
      <text x="594" y="140">Canonical → Physical IR</text><text x="594" y="165">RVV / IME · SIMD / AMX</text>
      <text x="864" y="140">typed ABI / native grid</text><text x="864" y="165">numerical check + timing</text>
    </g>
    <rect x="36" y="230" width="490" height="88" rx="12" fill="white" stroke="#c6d4e1"/>
    <text x="54" y="259" font-size="17" font-weight="bold">Keep JIT costs visible</text>
    <text x="54" y="286" font-size="14">cold call · disk-cache restore · cached Python call</text>
    <rect x="576" y="230" width="508" height="88" rx="12" fill="white" stroke="#c6d4e1"/>
    <text x="594" y="259" font-size="17" font-weight="bold">Compare the same native boundary</text>
    <text x="594" y="286" font-size="14">fixed GGML / vendor / BLAS reference · same inputs</text>
  </g>
  <g fill="none" stroke="#526579" stroke-width="2" marker-end="url(#arrow)">
    <path d="M256 134H296"/><path d="M526 134H566"/><path d="M796 134H836"/>
    <path d="M416 186V220"/><path d="M966 186V220"/>
  </g>
</svg>
